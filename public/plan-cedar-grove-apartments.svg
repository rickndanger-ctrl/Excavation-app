<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260">
  <rect width="320" height="260" fill="#f8f9fa"/>
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#e8eaed" stroke-width="0.3"/>
    </pattern>
    <pattern id="parking-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#dadce0" stroke-width="1.1"/>
    </pattern>
  </defs>
  <rect width="320" height="260" fill="url(#grid)"/>

  <!-- Parcel boundary -->
  <rect x="28" y="28" width="264" height="204" fill="none" stroke="#9aa0a6" stroke-width="1" stroke-dasharray="4,2.5" opacity="0.6"/>
  <text x="160" y="22" text-anchor="middle" font-family="Arial,sans-serif" font-size="4.5" fill="#9aa0a6">PARCEL BOUNDARY — 264.0' x 204.0'</text>

  <!-- Loop road frame (Cedar Grove Loop) -->
  <rect x="68" y="68" width="184" height="14" fill="#dadce0" stroke="#9aa0a6" stroke-width="0.8"/>
  <rect x="68" y="188" width="184" height="14" fill="#dadce0" stroke="#9aa0a6" stroke-width="0.8"/>
  <rect x="68" y="68" width="14" height="134" fill="#dadce0" stroke="#9aa0a6" stroke-width="0.8"/>
  <rect x="238" y="68" width="14" height="134" fill="#dadce0" stroke="#9aa0a6" stroke-width="0.8"/>

  <!-- Entry drive (Magnolia Way) -->
  <rect x="153" y="195" width="14" height="37" fill="#dadce0" stroke="#9aa0a6" stroke-width="0.8"/>

  <!-- Parking areas -->
  <rect x="78" y="84" width="60" height="10" fill="url(#parking-hatch)" stroke="#dadce0" stroke-width="0.5"/>
  <rect x="182" y="176" width="60" height="10" fill="url(#parking-hatch)" stroke="#dadce0" stroke-width="0.5"/>
  <text x="108" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="3.2" fill="#9aa0a6">Parking</text>
  <text x="212" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="3.2" fill="#9aa0a6">Parking</text>

  <!-- Buildings (footprints — labeled by the data overlay) -->
  <rect x="95" y="95" width="40" height="30" fill="#e8eaed" stroke="#9aa0a6" stroke-width="1.5" rx="1.5"/>
  <rect x="185" y="95" width="40" height="30" fill="#e8eaed" stroke="#9aa0a6" stroke-width="1.5" rx="1.5"/>
  <rect x="95" y="145" width="40" height="30" fill="#e8eaed" stroke="#9aa0a6" stroke-width="1.5" rx="1.5"/>
  <rect x="185" y="145" width="40" height="30" fill="#e8eaed" stroke="#9aa0a6" stroke-width="1.5" rx="1.5"/>
  <rect x="148" y="122" width="24" height="26" fill="#e8eaed" stroke="#9aa0a6" stroke-width="1.5" rx="1.5"/>

  <!-- Stormwater detention basin -->
  <ellipse cx="55" cy="212" rx="20" ry="14" fill="#d2e3fc" stroke="#669df6" stroke-width="1" opacity="0.75"/>
  <text x="55" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="3.4" fill="#1967d2">Detention</text>
  <text x="55" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="3.4" fill="#1967d2">Basin</text>

  <!-- Dimension callouts -->
  <line x1="28" y1="244" x2="292" y2="244" stroke="#5f6368" stroke-width="0.5"/>
  <text x="160" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="4" fill="#5f6368">264.0'</text>
  <line x1="304" y1="28" x2="304" y2="232" stroke="#5f6368" stroke-width="0.5"/>
  <text x="310" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="4" fill="#5f6368" transform="rotate(-90,310,132)">204.0'</text>
</svg>
