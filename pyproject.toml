[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "civil-plan-factory"
version = "0.1.0"
description = "Semantic civil-job test-data factory foundation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
model-studio = "civil_plan_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
